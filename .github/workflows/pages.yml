name: Deploy to GitHub Pages

# Publica la app SOLO si lint y tests pasan, y sube únicamente la versión construida
# (dist/, ver scripts/build.mjs) en lugar del repo entero.
# Requiere cambiar Settings → Pages → Source a "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      # La versión publicable sale de scripts/build.mjs: empaquetada, minificada y con
      # hash en los nombres. Solo se publica dist/, así que ni los tests ni el código
      # sin construir llegan al sitio.
      - name: Build (dist/)
        run: npm run build
      - name: Comprobar el sitio construido
        run: |
          # Red de seguridad: si algo del shell falta, el service worker cachearía
          # una app rota. Mejor romper el despliegue aquí.
          test -f dist/index.html
          test -f dist/sw.js
          test -f dist/css/fonts/outfit-latin.woff2
          grep -q '<script type="module" src="js/bootstrap-' dist/index.html
          test -z "$(find dist -name '*.test.js')"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
